name: Windows validation

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Build native x86 desktop
        shell: cmd
        run: cpp\build.bat
      - name: Verify update protocol and state machine
        shell: pwsh
        run: ./tools/Test-Updates.ps1 -SkipTray
      - name: Verify synthetic recording protocol
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: python tests/product_smoke.py --output docs/probe/ci/product
