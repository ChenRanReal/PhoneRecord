# Optional blank template. The application also supports an exe-only first launch.
# Copy to config.ini beside PhoneRecord.exe, or fill the Settings page directly.
# Enter your own phone/PC addresses and authorized WEB login. No sample address is supplied.
# fixed (default): use phone_ip directly.
# dhcp: first enter the current phone_ip and phone_mac; no DNS name is needed.
# Save, exit and reopen, then run one-click phone setup to pair address-change callbacks.
# The application detects on-link/routed peers; no ongoing MAC scans or checks after pairing.
# Keep config.ini.pairing with this configuration on the same Windows account.
phone_address_mode=fixed
phone_mac=
phone_ip=
phone_port=80
phone_user=
phone_pass=
advertise_ip=
control_port=10000
hook_port=18080
udp_port_start=20000
udp_port_end=20100
idle_timeout=5
health_interval=60
close_action=tray
tray_notifications=0
record_dir=recordings
ledger_file=recordings\calls.csv
directory_file=directory.json
# Save in the application to encrypt the password for the current Windows user.
# Connection changes: Save, use Exit, then reopen. X normally only hides to tray.
# Startup at sign-in is a separate Windows per-user setting, off by default.
# Change it immediately with the Settings checkbox; it is not copied in this file.

# New recordings: flat (default), daily, weekly (Monday), custom. Restart to apply.
record_folder_mode=flat
# Relative folders only; tokens: {yyyy}, {MM}, {dd}, {weekStart}.
record_folder_pattern={yyyy}/{MM}/{dd}
